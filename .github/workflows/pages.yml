# Reusable workflow: build a landing + docs site from the CALLER repo's
# README.md / docs/*.md (config: .github/site/site.toml) and deploy it to
# GitHub Pages. Builds on pull requests as a check; deploys on other events.
# The caller job needs permissions: contents: read, pages: write, id-token: write.
name: Pages site

on:
  workflow_call:
    inputs:
      generator_ref:
        description: Deprecated, ignored. The generator is checked out at the called workflow's own commit.
        type: string
        default: ""
      python_version:
        type: string
        default: "3.15"
      deploy:
        description: Deploy to Pages (ignored on pull_request, which never deploys)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The generator comes from this workflow's own commit, so bumping the
      # uses@ pin (e.g. by dependabot) also bumps the generator.
      - name: Resolve generator commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          GENERATOR_REF: ${{ inputs.generator_ref }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository/job.workflow_sha is empty; refusing to build with the generator's default branch"
            exit 1
          fi
          echo "generator: $WORKFLOW_REPO@$WORKFLOW_SHA"
          if [ -n "$GENERATOR_REF" ] && [ "$GENERATOR_REF" != "$WORKFLOW_SHA" ]; then
            echo "::warning::input generator_ref ($GENERATOR_REF) is deprecated and ignored; building with $WORKFLOW_SHA. Remove it from the caller."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-pages-site
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build site
        env:
          SITE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .gh-pages-site/site/build.py _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.deploy && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: inputs.deploy && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
